name: Linux builds
on:
  workflow_call:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor)
            artifact-name: linux-editor
            cache-name: linux-editor
            preset: linux-editor

          - name: Template (target=template_release)
            artifact-name: linux-release
            cache-name: linux-release
            preset: linux-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install GCC (Linux)
        shell: sh
        run: |
          sudo apt-get update
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get install gcc-13 g++-13 -y
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --config gcc
          sudo update-alternatives --config g++
      - name: Install Ninja (Linux)
        shell: sh
        run: |
          sudo apt-get install ninja-build
      - name: Build
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: ${{ matrix.artifact-name }}
          cache-name: ${{ matrix.cache-name }}
          preset-name: ${{ matrix.preset }}

      - name: Run native updater security tests
        if: matrix.artifact-name == 'linux-editor'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/linux-editor" \
            -DREDOTCHESTRATOR_BUILD_TESTS=ON
          cmake --build "$GITHUB_WORKSPACE/build/linux-editor" \
            --target redotchestrator_update_security_tests -j 2
          ctest --test-dir "$GITHUB_WORKSPACE/build/linux-editor" --output-on-failure

      - name: Run release packaging tests
        if: matrix.artifact-name == 'linux-editor'
        shell: bash
        run: python tests/test_package_release.py

      - name: Install pinned Redot 26.2 test editor
        if: matrix.artifact-name == 'linux-editor'
        shell: bash
        env:
          REDOT_ARCHIVE_URL: https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_linux_x64.zip
          REDOT_ARCHIVE_SHA256: f474d890806c41af15513cf5a8600243e241882e11b68dbb95660e3465b5b1e4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Redot_v26.2-stable_linux_x64.zip"
          install_dir="$RUNNER_TEMP/redot-26.2"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" "$REDOT_ARCHIVE_URL"
          echo "$REDOT_ARCHIVE_SHA256  $archive" | sha256sum --check --strict -
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/redot.linuxbsd.editor.x86_64"
          echo "REDOT_BIN=$install_dir/redot.linuxbsd.editor.x86_64" >> "$GITHUB_ENV"
          "$install_dir/redot.linuxbsd.editor.x86_64" --version

      - name: Run integration tests
        if: matrix.artifact-name == 'linux-editor'
        shell: bash
        working-directory: ${{ github.workspace }}/tests
        run: |
          python run_integration_tests.py --redot-binary "$REDOT_BIN" --no-color

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm
    name: ${{ matrix.name }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Editor (target=editor,arch=arm64)
            artifact-name: linux-editor-arm64
            cache-name: linux-editor-arm64
            preset: linux-editor

          - name: Template (target=template_release,arch=arm64)
            artifact-name: linux-release-arm64
            cache-name: linux-release-arm64
            preset: linux-release

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install GCC (Linux)
        shell: sh
        run: |
          sudo apt-get update
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test
          sudo apt-get install gcc-13 g++-13 -y
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --config gcc
          sudo update-alternatives --config g++
      - name: Install Ninja (Linux)
        shell: sh
        run: |
          sudo apt-get install ninja-build
      - name: Build
        uses: ./.github/actions/orchestrator-build
        with:
          artifact-name: ${{ matrix.artifact-name }}
          cache-name: ${{ matrix.cache-name }}
          preset-name: ${{ matrix.preset }}
          python-arch: 'arm64'
