name: Generate Change Log

on:
  workflow_dispatch:
    inputs:
      last_release:
        description: 'Last release tag'
        required: true
      target_sha:
        description: 'Target sha'
        required: true

jobs:
  script:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags so changelog-generator can diff base-ref..head-ref
          # without deepening the clone (which triggers "shallow file has changed").
          fetch-depth: 0
          fetch-tags: true

      - name: Generate changes
        id: changelog
        uses: metcalfc/changelog-generator@0440d0932f9a0dd1cc9ecd8412830761351323bd # v4.7.0
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
          head-ref: ${{ github.event.inputs.target_sha }}
          base-ref: ${{ github.event.inputs.last_release }}

      - name: Get the changelog
        run: |
          cat << "EOF"
          ${{ steps.changelog.outputs.changelog }}
          EOF
